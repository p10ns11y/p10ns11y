<svg xmlns="http://www.w3.org/2000/svg" width="420" height="292" viewBox="0 0 420 292" role="img" aria-labelledby="map-title">
  <title id="map-title">2015 phone boxes mapped to 2026 agent clothes</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8B6B4E"/>
    </marker>
  </defs>

  <!-- 2015 cluster -->
  <rect x="8" y="28" width="172" height="256" rx="8" fill="#E0D9CE" stroke="#8B6B4E" stroke-width="1"/>
  <text x="94" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6E665C">phone</text>
  <text x="94" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2A2622">2015</text>

  <!-- 2026 cluster -->
  <rect x="240" y="28" width="172" height="256" rx="8" fill="#E0D9CE" stroke="#8B6B4E" stroke-width="1"/>
  <text x="326" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6E665C">agents</text>
  <text x="326" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2A2622">2026</text>

  <!-- nodes: left -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#F5F0E8" text-anchor="middle">
    <rect x="20" y="60" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="94" y="80">Orchestrator</text>
    <rect x="20" y="100" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="94" y="120">Time / place</text>
    <rect x="20" y="140" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="94" y="160">Knowledge graph</text>
    <rect x="20" y="180" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="94" y="200">Control</text>
    <rect x="20" y="220" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="94" y="240">Wisdom</text>
  </g>

  <!-- nodes: right -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#F5F0E8" text-anchor="middle">
    <rect x="252" y="60" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="326" y="80">Harness</text>
    <rect x="252" y="100" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="326" y="120">When / where</text>
    <rect x="252" y="140" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="326" y="160">Vector memory</text>
    <rect x="252" y="180" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="326" y="200">Guards</text>
    <rect x="252" y="220" width="148" height="32" rx="5" fill="#628875" stroke="#9A7040" stroke-width="1"/>
    <text x="326" y="240">Router + eval</text>
  </g>

  <!-- 1:1 arrows -->
  <g stroke="#8B6B4E" stroke-width="1.25" fill="none" marker-end="url(#arrow)">
    <line x1="176" y1="76" x2="244" y2="76"/>
    <line x1="176" y1="116" x2="244" y2="116"/>
    <line x1="176" y1="156" x2="244" y2="156"/>
    <line x1="176" y1="196" x2="244" y2="196"/>
    <line x1="176" y1="236" x2="244" y2="236"/>
  </g>
</svg>
